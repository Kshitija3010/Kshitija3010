<html><head><meta charset="utf-8"><title>दुनिया की पहली रोटी · Kathaverse</title>

</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// प्राचीन रसोई · Ep 1 · दुनिया की पहली रोटी — Tablet Sketch Explainer, Kathaverse.
// Page contract: ?f=h|v (16:9 or 9:16) · ?a=&b= a stretch of the film clock · ?clean=1 no stylus/subtitles/bug · ?thumb=1 the thumbnail card.
const QS = new URLSearchParams(location.search);
const F = QS.get('f') === 'v' ? 'v' : 'h', W = F === 'h' ? 1920 : 1080, H = F === 'h' ? 1080 : 1920, FPS = 24;
const CLEAN = QS.get('clean') === '1', THUMB = QS.get('thumb') === '1';
// canvas domain (world units) and buffer resolution
const X0 = -60, Y0 = -40, DW = 3760, DH = 1880, S = 1.6;
const BW = Math.round(DW * S), BH = Math.round(DH * S);
const PX = x => (x - X0) * S, PY = y => (y - Y0) * S;
const C = { paper: '#f3eadb', graphite: '#43362e', light: '#a8998a', coral: '#dc6a4c', mustard: '#f1c04f',
  sea: '#a9c8d4', water: '#8fb8cc', desert: '#8a7d73', thatch: '#c9a46a', thatchDk: '#a8834d', stone: '#9b8f86', stoneDk: '#7a6e66',
  basalt: '#7f746c', flame: '#ec8d3e', wheat: '#e3c27a', wheatDk: '#c49a4c', stem: '#b8a46a', sedge: '#9bb77e', sedgeDk: '#6f9160',
  tuber: '#a9805a', tuberDk: '#86603f', flour: '#efe0bf', dough: '#efdcb2', golden: '#e0b064', toasted: '#b97a3e', char: '#5b3a26',
  bowl: '#a39a90', ash: '#bdb4aa', sage: '#a9c79a' };
const hex = c => [parseInt(c.slice(1, 3), 16) / 255, parseInt(c.slice(3, 5), 16) / 255, parseInt(c.slice(5, 7), 16) / 255];
</script>
